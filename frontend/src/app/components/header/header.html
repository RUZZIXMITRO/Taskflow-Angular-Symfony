<header class="header">
  <div class="container header__inner">
    <div class="brand">
      <h1>{{ title() }}</h1>
      <button type="button" class="btn btn--ghost btn--sm" (click)="rename()"
              [attr.aria-label]="'Renommer le titre ' + title()">
        Renommer
      </button>
    </div>

    <nav aria-label="Navigation principale">
      <a routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Tâches</a>
      <a routerLink="/tasks/new" routerLinkActive="active">Nouvelle tâche</a>
      <a routerLink="/admin" routerLinkActive="active">Admin</a>
      @if (auth.user(); as user) {
        <span class="user">{{ user.username }}</span>
        <button type="button" class="btn btn--ghost btn--sm" (click)="logout()">Déconnexion</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Connexion</a>
      }
    </nav>
  </div>
</header>
