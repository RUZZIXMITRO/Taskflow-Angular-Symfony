# Exemple de déploiement : Angular (fichiers statiques) + API Symfony sur le même domaine.
# Même origine → pas de CORS à configurer.
server {
    listen 80;
    server_name taskflow.local;

    # 1) Front Angular : contenu de frontend/dist/frontend/browser
    root /var/www/taskflow/frontend;
    index index.html;

    # Fallback SPA : toute route inconnue (ex. /tasks/42) renvoie index.html,
    # le routeur Angular affiche ensuite la bonne page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers avec hash dans le nom : cache long
    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2) API Symfony (PHP-FPM)
    location /api {
        root /var/www/taskflow/backend/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/taskflow/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }
}
